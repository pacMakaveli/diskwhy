<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>diskwhy</title>
<style>
  :root {
    --bg: #f6f6f4; --panel: #ffffff; --text: #1d1d1b; --muted: #6b6b66; --line: #e4e4df;
    --accent: #2f5bea; --bar: #dfe5fb; --bar-fill: #7d97f2;
    --regenerable: #1f8a4c; --review: #b7791f; --data: #2f5bea; --stale: #c0392b;
    --danger: #c0392b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #151514; --panel: #1e1e1c; --text: #ecece8; --muted: #9a9a93; --line: #2f2f2c;
      --accent: #7d97f2; --bar: #272b3d; --bar-fill: #5d78d8;
      --regenerable: #4cc380; --review: #e0a93d; --data: #7d97f2; --stale: #ef6f60;
      --danger: #ef6f60;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif; }
  .wrap { max-width: 1040px; margin: 0 auto; padding: 24px 16px 64px; }
  h1 { font-size: 20px; margin: 0 0 16px; letter-spacing: -0.01em; }
  h1 small { color: var(--muted); font-weight: 400; font-size: 13px; margin-left: 8px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; }
  .volume { padding: 16px; margin-bottom: 16px; }
  .gauge { height: 10px; border-radius: 5px; background: var(--bar); overflow: hidden; margin: 10px 0 6px; }
  .gauge > div { height: 100%; background: var(--accent); }
  .gauge.hot > div { background: var(--stale); }
  .volume .nums { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px; color: var(--muted); }
  .volume .nums b { color: var(--text); font-weight: 600; }
  .tabs { display: flex; gap: 4px; margin-bottom: 12px; }
  .tabs button { background: none; border: 0; padding: 8px 14px; border-radius: 8px; color: var(--muted); font: inherit; cursor: pointer; }
  .tabs button[aria-selected="true"] { background: var(--panel); color: var(--text); border: 1px solid var(--line); }
  .summary { padding: 12px 16px; margin-bottom: 12px; color: var(--muted); }
  .summary b { color: var(--text); }
  .row { display: grid; grid-template-columns: minmax(0, 1fr) 84px auto; align-items: center; gap: 12px; padding: 10px 16px; border-top: 1px solid var(--line); position: relative; }
  .row:first-child { border-top: 0; }
  .row .meta { min-width: 0; position: relative; z-index: 1; }
  .row .title { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .row .title span.name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500; }
  .row .sub { color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .size { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; position: relative; z-index: 1; }
  .row .acts { display: flex; gap: 6px; position: relative; z-index: 1; }
  .row .fill { position: absolute; inset: 0 auto 0 0; background: var(--bar); opacity: .55; z-index: 0; }
  .badge { font-size: 11px; padding: 1px 7px; border-radius: 999px; border: 1px solid currentColor; flex: none; }
  .badge.regenerable { color: var(--regenerable); } .badge.review { color: var(--review); }
  .badge.data { color: var(--data); } .badge.stale { color: var(--stale); }
  button.btn { font: inherit; padding: 4px 10px; border-radius: 7px; border: 1px solid var(--line); background: var(--panel); color: var(--text); cursor: pointer; }
  button.btn:hover { border-color: var(--accent); }
  button.btn.danger { color: var(--danger); }
  button.btn:disabled { opacity: .4; cursor: not-allowed; }
  .crumbs { padding: 10px 16px; display: flex; flex-wrap: wrap; gap: 4px; align-items: center; border-bottom: 1px solid var(--line); color: var(--muted); }
  .crumbs a { color: var(--accent); cursor: pointer; text-decoration: none; }
  .crumbs a:hover { text-decoration: underline; }
  .toolbar { padding: 10px 16px; display: flex; gap: 8px; align-items: center; border-bottom: 1px solid var(--line); color: var(--muted); }
  .toolbar input { font: inherit; padding: 4px 8px; width: 80px; border: 1px solid var(--line); border-radius: 7px; background: var(--bg); color: var(--text); }
  .empty, .loading, .error { padding: 32px 16px; text-align: center; color: var(--muted); }
  .error { color: var(--danger); }
  .hint code { background: var(--bar); padding: 1px 5px; border-radius: 4px; font-size: 12px; }
  dialog { border: 1px solid var(--line); border-radius: 12px; background: var(--panel); color: var(--text); padding: 20px; width: min(520px, calc(100vw - 32px)); }
  dialog::backdrop { background: rgb(0 0 0 / .45); }
  dialog h2 { margin: 0 0 4px; font-size: 16px; }
  dialog .path { color: var(--muted); word-break: break-all; font-size: 12px; margin-bottom: 14px; }
  dialog label { display: block; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; margin-bottom: 8px; cursor: pointer; }
  dialog label small { display: block; color: var(--muted); }
  dialog input[type=text] { width: 100%; font: inherit; padding: 6px 8px; border: 1px solid var(--line); border-radius: 7px; background: var(--bg); color: var(--text); margin: 4px 0 12px; }
  dialog .foot { display: flex; justify-content: flex-end; gap: 8px; }
  dialog .err { color: var(--danger); margin-bottom: 10px; }
  .toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 8px 14px; border-radius: 8px; }
  @media (max-width: 640px) { .row { grid-template-columns: minmax(0, 1fr) auto; } .row .size { grid-column: 2; grid-row: 1; } .row .acts { grid-column: 1 / -1; } }
</style>
</head>
<body>
<div class="wrap">
  <h1>diskwhy<small>what is eating this disk</small></h1>
  <div class="card volume" id="volume"></div>
  <div class="tabs" role="tablist" id="tabs"></div>
  <div id="view"></div>
</div>
<dialog id="dlg"></dialog>

<script>
const TOKEN = '__TOKEN__';
const KIND_LABEL = { regenerable: 'regenerable', review: 'review', data: 'data', stale: 'stale' };

const fmt = (bytes) => {
  if (bytes == null) return 'n/a';
  const units = ['B', 'KB', 'MB', 'GB', 'TB'];
  let i = 0, n = bytes;
  while (n >= 1000 && i < units.length - 1) { n /= 1000; i++; }
  return `${n >= 100 || i === 0 ? n.toFixed(0) : n.toFixed(1)} ${units[i]}`;
};

// All text goes through textContent, never innerHTML: file names are untrusted.
const h = (tag, attrs = {}, ...kids) => {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (v === true) el.setAttribute(k, '');
    else if (v !== false && v != null) el.setAttribute(k, v);
  }
  for (const kid of kids.flat()) if (kid != null && kid !== false) el.append(kid);
  return el;
};

async function api(path, options = {}) {
  const res = await fetch(path, { ...options, headers: { 'X-DiskWhy-Token': TOKEN, 'Content-Type': 'application/json' } });
  const body = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(body.error || res.statusText);
  return body;
}

const state = { tab: 'hotspots', dir: null };
const view = document.getElementById('view');

function toast(message) {
  const t = h('div', { class: 'toast' }, message);
  document.body.append(t);
  setTimeout(() => t.remove(), 3500);
}

async function renderVolume() {
  const v = await api('/api/volume');
  const pct = (v.used / v.total) * 100;
  document.getElementById('volume').replaceChildren(
    h('div', { class: 'nums' },
      h('span', {}, h('b', {}, fmt(v.free)), ' free of ', fmt(v.total)),
      h('span', {}, pct.toFixed(0) + '% used')),
    h('div', { class: `gauge${pct > 90 ? ' hot' : ''}` }, h('div', { style: `width:${pct}%` })));
}

function renderTabs() {
  const tabs = [['hotspots', 'Hotspots'], ['explorer', 'Explorer'], ['large', 'Large files']];
  document.getElementById('tabs').replaceChildren(...tabs.map(([id, label]) =>
    h('button', { role: 'tab', 'aria-selected': String(state.tab === id), onclick: () => { state.tab = id; show(); } }, label)));
}

const loading = (what) => view.replaceChildren(h('div', { class: 'card loading' }, `Scanning ${what}… this can take a while on a big disk.`));
const failed = (e) => view.replaceChildren(h('div', { class: 'card error' }, e.message));

function removeButton(item, label = 'Remove…') {
  return h('button', {
    class: 'btn danger', disabled: !!item.blocker || item.removable === false,
    title: item.blocker || '', onclick: () => openRemove(item),
  }, label);
}

async function showHotspots() {
  loading('known hotspots');
  const rows = await api('/api/hotspots');
  const reclaimable = rows.filter(r => r.kind === 'regenerable' || r.kind === 'stale').reduce((a, r) => a + r.size, 0);
  view.replaceChildren(
    h('div', { class: 'card summary' }, h('b', {}, fmt(reclaimable)), ' sits in regenerable caches and unused database directories. ',
      'Open an item to look inside before removing anything.'),
    h('div', { class: 'card' }, rows.length ? rows.map(r =>
      h('div', { class: 'row' },
        h('div', { class: 'meta' },
          h('div', { class: 'title' }, h('span', { class: 'name' }, r.label), h('span', { class: `badge ${r.kind}` }, KIND_LABEL[r.kind])),
          h('div', { class: 'sub' }, r.path),
          (r.note || r.hint) && h('div', { class: 'sub hint' }, r.note, r.note && r.hint ? ' · ' : '', r.hint && h('span', {}, 'or run ', h('code', {}, r.hint))),
          r.blocker && h('div', { class: 'sub' }, 'Not removable here: ' + r.blocker)),
        h('div', { class: 'size' }, fmt(r.size)),
        h('div', { class: 'acts' }, h('button', { class: 'btn', onclick: () => { state.tab = 'explorer'; state.dir = r.path; show(); } }, 'Open'), removeButton(r)))
    ) : h('div', { class: 'empty' }, 'Nothing large found.')));
}

async function showExplorer() {
  loading(state.dir || 'your home folder');
  const data = await api(state.dir ? '/api/ls?path=' + encodeURIComponent(state.dir) : '/api/ls');
  state.dir = data.path;
  const max = Math.max(...data.entries.map(e => e.size), 1);
  const parts = data.path.split('/').filter(Boolean);
  const crumbs = [h('a', { onclick: () => { state.dir = '/'; show(); } }, '/')];
  parts.forEach((p, i) => {
    const target = '/' + parts.slice(0, i + 1).join('/');
    crumbs.push(h('span', {}, '›'), h('a', { onclick: () => { state.dir = target; show(); } }, p));
  });
  view.replaceChildren(h('div', { class: 'card' },
    h('div', { class: 'crumbs' }, ...crumbs, h('span', { style: 'margin-left:auto' }, fmt(data.total))),
    data.entries.length ? data.entries.map(e =>
      h('div', { class: 'row' },
        h('div', { class: 'fill', style: `width:${(e.size / max) * 100}%` }),
        h('div', { class: 'meta' },
          h('div', { class: 'title' },
            e.is_dir
              ? h('a', { class: 'name', style: 'cursor:pointer;color:var(--accent)', onclick: () => { state.dir = e.path; show(); } }, e.name + '/')
              : h('span', { class: 'name' }, e.name),
            e.is_link && h('span', { class: 'badge review' }, 'link'))),
        h('div', { class: 'size' }, fmt(e.size)),
        h('div', { class: 'acts' }, removeButton(e)))
    ) : h('div', { class: 'empty' }, 'Empty.')));
}

async function showLarge() {
  const root = state.largeRoot || '', min = state.largeMin || 200;
  loading('for large files');
  const rows = await api(`/api/large?min_mb=${min}` + (root ? '&root=' + encodeURIComponent(root) : ''));
  const input = h('input', { type: 'number', min: '10', value: String(min) });
  view.replaceChildren(h('div', { class: 'card' },
    h('div', { class: 'toolbar' }, 'Files larger than', input, 'MB',
      h('button', { class: 'btn', onclick: () => { state.largeMin = +input.value || 200; show(); } }, 'Rescan')),
    rows.length ? rows.map(f =>
      h('div', { class: 'row' },
        h('div', { class: 'meta' },
          h('div', { class: 'title' }, h('span', { class: 'name' }, f.path.split('/').pop())),
          h('div', { class: 'sub' }, f.path + ' · modified ' + new Date(f.mtime * 1000).toLocaleDateString())),
        h('div', { class: 'size' }, fmt(f.size)),
        h('div', { class: 'acts' }, removeButton({ path: f.path, size: f.size }))))
    : h('div', { class: 'empty' }, 'No files that large.')));
}

function openRemove(item) {
  const dlg = document.getElementById('dlg');
  const name = item.path.split('/').pop();
  let mode = 'trash';
  const err = h('div', { class: 'err' });
  const confirmInput = h('input', { type: 'text', placeholder: name, autocomplete: 'off' });
  const confirmBox = h('div', { hidden: true }, 'Type ', h('b', {}, name), ' to confirm:', confirmInput);
  const submit = h('button', { class: 'btn', value: 'go' }, 'Move to Trash');

  const choose = (m) => { mode = m; confirmBox.hidden = m !== 'delete'; submit.textContent = m === 'delete' ? 'Delete permanently' : 'Move to Trash'; submit.classList.toggle('danger', m === 'delete'); };
  const radio = (value, title, desc) => h('label', {}, h('input', { type: 'radio', name: 'mode', value, checked: value === 'trash', onchange: () => choose(value) }), ' ', h('b', {}, title), h('small', {}, desc));

  dlg.replaceChildren(
    h('h2', {}, `Remove ${name}?`),
    h('div', { class: 'path' }, item.path + (item.size ? ` · ${fmt(item.size)}` : '')),
    radio('trash', 'Move to Trash', 'Reversible, but frees no space until you empty the Trash.'),
    radio('delete', 'Delete permanently', 'Frees the space now. Cannot be undone.'),
    confirmBox, err,
    h('div', { class: 'foot' },
      h('button', { class: 'btn', onclick: () => dlg.close() }, 'Cancel'), submit));

  submit.addEventListener('click', async () => {
    submit.disabled = true; err.textContent = '';
    try {
      const out = await api('/api/remove', { method: 'POST', body: JSON.stringify({ path: item.path, mode, confirm: confirmInput.value }) });
      dlg.close();
      toast(`${out.mode === 'delete' ? 'Deleted' : 'Moved to Trash'}: ${name} (${fmt(out.size)})`);
      renderVolume(); show();
    } catch (e) { err.textContent = e.message; submit.disabled = false; }
  });
  dlg.showModal();
}

async function show() {
  renderTabs();
  try {
    if (state.tab === 'hotspots') await showHotspots();
    else if (state.tab === 'explorer') await showExplorer();
    else await showLarge();
  } catch (e) { failed(e); }
}

renderVolume().catch(() => {});
show();
</script>
</body>
</html>
